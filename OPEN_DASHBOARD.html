<!DOCTYPE html>
<html>
<head>
    <title>Redirecting to Dashboard...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 2.5em; margin-bottom: 20px; }
        p { font-size: 1.2em; margin: 15px 0; }
        .link {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1em;
            transition: transform 0.3s;
        }
        .link:hover {
            transform: scale(1.05);
        }
        .warning {
            background: #ff6b6b;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ WRONG URL!</h1>
        <p>You opened this from your file system.</p>
        <p>The dashboard requires XAMPP to work!</p>
        
        <div class="warning">
            <strong>You MUST use this URL:</strong><br>
            <code style="font-size: 1.1em;">http://localhost/ProjectDashboard/page/dashboard.html</code>
        </div>
        
        <a href="http://localhost/ProjectDashboard/page/dashboard.html" class="link">
            🚀 Open Dashboard via XAMPP
        </a>
        
        <p style="margin-top: 30px; font-size: 0.9em; opacity: 0.8;">
            Redirecting automatically in <span id="countdown">3</span> seconds...
        </p>
    </div>
    
    <script>
        // Auto-redirect after 3 seconds
        let count = 3;
        const countdown = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            count--;
            countdown.textContent = count;
            
            if (count <= 0) {
                clearInterval(timer);
                window.location.href = 'http://localhost/ProjectDashboard/page/dashboard.html';
            }
        }, 1000);
    </script>
</body>
</html>
