<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=http://localhost/ProjectDashboard/page/dashboard.html">
    <title>Redirecting to Dashboard...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .container {
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 2em; margin-bottom: 20px; }
        p { font-size: 1.2em; margin: 15px 0; }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
        }
        a:hover {
            transform: scale(1.05);
        }
        .url {
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 5px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Redirecting to Dashboard...</h1>
        <div class="spinner"></div>
        <p>If you are not redirected automatically:</p>
        <div class="url">http://localhost/ProjectDashboard/page/dashboard.html</div>
        <a href="http://localhost/ProjectDashboard/page/dashboard.html">Click Here to Open Dashboard</a>
        
        <p style="margin-top: 30px; font-size: 0.9em; opacity: 0.8;">
            ⚠️ Make sure XAMPP is running!
        </p>
    </div>
    
    <script>
        // Redirect after 1 second
        setTimeout(() => {
            window.location.href = 'http://localhost/ProjectDashboard/page/dashboard.html';
        }, 1000);
    </script>
</body>
</html>
