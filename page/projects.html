<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Monitoring & Project Management System</title>
    <link rel="stylesheet" href="../css/projects.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <h2>📊 DashBoard</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="http://localhost/ProjectDashboard/page/dashboard.html">Dashboard</a></li>
                <li><a href="http://localhost/ProjectDashboard/page/projects.html" class="active">Projects</a></li>
                <li><a href="http://localhost/ProjectDashboard/page/monitoring.html">Monitoring</a></li>
                <li><a href="http://localhost/ProjectDashboard/page/tasks.html">Tasks</a></li>
                <li><a href="http://localhost/ProjectDashboard/page/team.html">Team</a></li>
                <li><a href="http://localhost/ProjectDashboard/page/reports.html">Reports</a></li>
                <li><a href="http://localhost/ProjectDashboard/page/admin.html">Admin</a></li>
                <li><a href="http://localhost/ProjectDashboard/page/settings.html">Settings</a></li>
                <li><a href="http://localhost/ProjectDashboard/settings/logout.php" style="color: #ff6b6b;">Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h1>Projects</h1>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="avatar" id="userAvatar">A</div>
                        <span id="userName">Admin User</span>
                    </div>
                </div>
            </header>

            <div class="action-bar">
                <button class="btn-primary">+ New Project</button>
            </div>

            <!-- Projects Filter -->
            <section class="filter-section">
                <div class="filter-group">
                    <input type="text" placeholder="Search projects..." class="search-input">
                    <select class="filter-select">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                        <option value="on-hold">On Hold</option>
                    </select>
                    <select class="filter-select">
                        <option value="">All Teams</option>
                        <option value="frontend">Frontend</option>
                        <option value="backend">Backend</option>
                        <option value="mobile">Mobile</option>
                    </select>
                </div>
            </section>

            <!-- Projects Grid -->
            <section class="projects-grid" id="projectsGrid">
                <!-- Projects will be loaded dynamically -->
                <div class="loading-message">Loading projects...</div>
            </section>
        </main>
    </div>

    <!-- New Project Modal -->
    <div id="newProjectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📁 Create New Project</h2>
                <span class="close">&times;</span>
            </div>
            <form id="newProjectForm">
                <div class="form-group">
                    <label for="projectName">Project Name *</label>
                    <input type="text" id="projectName" name="name" required placeholder="Enter project name">
                </div>
                
                <div class="form-group">
                    <label for="projectDescription">Description</label>
                    <textarea id="projectDescription" name="description" rows="3" placeholder="Brief description of the project"></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="projectStartDate">Start Date *</label>
                        <input type="date" id="projectStartDate" name="start_date" required>
                    </div>
                    <div class="form-group">
                        <label for="projectEndDate">End Date *</label>
                        <input type="date" id="projectEndDate" name="end_date" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="projectStatus">Status</label>
                        <select id="projectStatus" name="status">
                            <option value="active">Active</option>
                            <option value="on-hold">On Hold</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="projectProgress">Initial Progress (%)</label>
                        <input type="number" id="projectProgress" name="progress" min="0" max="100" value="0" placeholder="0">
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn-secondary cancel-btn">Cancel</button>
                    <button type="submit" class="btn-primary">Create Project</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- View Project Modal -->
    <div id="viewProjectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🔍 Project Details</h2>
                <span class="close view-close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="view-row" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
                    <h3 id="viewProjectName">Loading...</h3>
                    <span id="viewProjectStatus" class="status-badge">&nbsp;</span>
                </div>
                <p id="viewProjectDescription" class="project-desc"></p>

                <div class="view-meta" style="display:flex;gap:20px;flex-wrap:wrap;color:var(--text-light);">
                    <div><strong>Start:</strong> <span id="viewStartDate">-</span></div>
                    <div><strong>End:</strong> <span id="viewEndDate">-</span></div>
                    <div><strong>Progress:</strong> <span id="viewProgress">0%</span></div>
                </div>

                <div class="view-finance" style="display:flex;gap:20px;margin-top:12px;color:var(--text-light);">
                    <div><strong>Budget:</strong> <span id="viewBudget">-</span></div>
                    <div><strong>Spent:</strong> <span id="viewSpent">-</span></div>
                </div>

                <div class="view-footer" style="margin-top:16px; text-align:right;">
                    <button class="btn-secondary view-close">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Project Modal -->
    <div id="editProjectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✏️ Edit Project</h2>
                <span class="close edit-close">&times;</span>
            </div>
            <form id="editProjectForm">
                <input type="hidden" id="editProjectId" name="id">
                <div class="form-group">
                    <label for="editProjectName">Project Name *</label>
                    <input type="text" id="editProjectName" name="name" required>
                </div>
                <div class="form-group">
                    <label for="editProjectDescription">Description</label>
                    <textarea id="editProjectDescription" name="description" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editProjectStartDate">Start Date</label>
                        <input type="date" id="editProjectStartDate" name="start_date">
                    </div>
                    <div class="form-group">
                        <label for="editProjectEndDate">End Date</label>
                        <input type="date" id="editProjectEndDate" name="end_date">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editProjectStatus">Status</label>
                        <select id="editProjectStatus" name="status">
                            <option value="active">Active</option>
                            <option value="on-hold">On Hold</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editProjectProgress">Progress (%)</label>
                        <input type="number" id="editProjectProgress" name="progress" min="0" max="100">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editProjectBudget">Budget</label>
                        <input type="number" step="0.01" id="editProjectBudget" name="budget">
                    </div>
                    <div class="form-group">
                        <label for="editProjectSpent">Spent</label>
                        <input type="number" step="0.01" id="editProjectSpent" name="spent">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary edit-close">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/projects.js"></script>
    <script>
    fetch('../settings/get_user.php').then(r=>r.json()).then(d=>{
        if(d&&d.full_name){const n=d.full_name;const a=document.getElementById('userAvatar');const s=document.getElementById('userName');if(a)a.textContent=n.charAt(0).toUpperCase();if(s)s.textContent=n;}
    }).catch(()=>{});
    </script>
</body>
</html>
